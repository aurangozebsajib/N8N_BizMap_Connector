name: Audio Factory - Bangla gTTS
on: [workflow_dispatch]
jobs:
  audio-factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r audio/requirements.txt
      - name: Run Factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API: ${{ secrets.OPENROUTER_API }}
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python audio/factory.py
      - name: Upload MP3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bangla-audio-mp3
          path: output/*.mp3
