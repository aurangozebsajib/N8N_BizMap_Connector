name: brain-factory

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-all:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Execute Plan Mode
      run: |
        export PYTHONPATH=.
        python brain/main.py --mode plan
      env:
        GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
        API_KEYS_SHEET: ${{ secrets.API_KEYS_SHEET }}
        MODEL_STORAGE_SHEET: ${{ secrets.MODEL_STORAGE_SHEET }}
        STORY_STORAGE_DOC: ${{ secrets.STORY_STORAGE_DOC }}
    - name: Execute Video Mode & Telegram Dispatch
      run: |
        export PYTHONPATH=.
        python brain/main.py --mode video
      env:
        GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
        API_KEYS_SHEET: ${{ secrets.API_KEYS_SHEET }}
        MODEL_STORAGE_SHEET: ${{ secrets.MODEL_STORAGE_SHEET }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        STORY_STORAGE_DOC: ${{ secrets.STORY_STORAGE_DOC }}
