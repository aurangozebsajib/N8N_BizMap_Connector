name: Brain Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Run Plan Mode
      run: |
        export PYTHONPATH=.
        python brain/main.py --mode plan
        # একটি ডামি বা আউটপুট ফাইল তৈরি করা যাতে আর্টিফ্যাক্ট খালি না থাকে
        mkdir -p output_artifacts
        echo "plan_completed" > output_artifacts/status.txt
    - name: Upload Plan Artifact
      uses: actions/upload-artifact@v4
      with:
        name: plan
        path: output_artifacts/

  video:
    needs: plan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Download Plan Artifact
      uses: actions/download-artifact@v4
      with:
        name: plan
    - name: Run Video Mode & Send to Telegram
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      run: |
        export PYTHONPATH=.
        python brain/main.py --mode video
