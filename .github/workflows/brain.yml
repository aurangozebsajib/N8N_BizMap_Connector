name: brain-factory

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Plan
        run: PYTHONPATH=. python brain/main.py --mode plan
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          API_KEYS_SHEET: ${{ secrets.API_KEYS_SHEET }}
          MODEL_STORAGE_SHEET: ${{ secrets.MODEL_STORAGE_SHEET }}
          STORY_STORAGE_DOC: ${{ secrets.STORY_STORAGE_DOC }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: output/plan/

  video:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: plan
          path: output/plan/

      - name: Run Video Generation
        run: PYTHONPATH=. python brain/main.py --mode video
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          API_KEYS_SHEET: ${{ secrets.API_KEYS_SHEET }}
          MODEL_STORAGE_SHEET: ${{ secrets.MODEL_STORAGE_SHEET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          STORY_STORAGE_DOC: ${{ secrets.STORY_STORAGE_DOC }}

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/video/
