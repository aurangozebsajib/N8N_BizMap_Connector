name: brain-factory

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-all:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Plan and Video Mode
      env:
        GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
        API_KEYS_SHEET: ${{ secrets.API_KEYS_SHEET }}
        MODEL_STORAGE_SHEET: ${{ secrets.MODEL_STORAGE_SHEET }}
        STORY_STORAGE_DOC: ${{ secrets.STORY_STORAGE_DOC }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: |
        export PYTHONPATH=.
        echo "=== Running Plan Mode ==="
        python brain/main.py --mode plan
        echo "=== Running Video Mode & Telegram Dispatch ==="
        python brain/main.py --mode video
