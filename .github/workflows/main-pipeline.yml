name: BizMap Automation Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-all:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    - name: Execute Plan Mode
      run: |
        export PYTHONPATH=.
        python brain/main.py --mode plan
    - name: Execute Video Mode & Telegram Dispatch
      run: |
        export PYTHONPATH=.
        python brain/main.py --mode video
