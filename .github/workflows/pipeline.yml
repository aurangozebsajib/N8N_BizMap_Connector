name: Complete N8N Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  execute-all:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Verify Environment Secrets Presence
      run: |
        echo "Checking if Telegram secrets are available..."
        if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
          echo "❌ TELEGRAM_BOT_TOKEN is MISSING!"
        else
          echo "✅ TELEGRAM_BOT_TOKEN is present."
        fi
        if [ -z "${{ secrets.TELEGRAM_CHANNEL_ID }}" ]; then
          echo "❌ TELEGRAM_CHANNEL_ID is MISSING!"
        else
          echo "✅ TELEGRAM_CHANNEL_ID is present."
        fi

    - name: Run Complete Workflow (Plan and Video Modes)
      env:
        GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
        API_KEYS_SHEET: ${{ secrets.API_KEYS_SHEET }}
        MODEL_STORAGE_SHEET: ${{ secrets.MODEL_STORAGE_SHEET }}
        STORY_STORAGE_DOC: ${{ secrets.STORY_STORAGE_DOC }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: |
        export PYTHONPATH=.
        echo "=== Executing Plan Mode ==="
        python brain/main.py --mode plan
        echo "=== Executing Video Mode & Telegram Dispatch ==="
        python brain/main.py --mode video
